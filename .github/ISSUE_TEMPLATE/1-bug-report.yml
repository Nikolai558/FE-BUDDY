name: Bug report
description: Something in FE-BUDDY doesn't work the way it should.
title: "[BUG] - "
labels: ["bug", "v3.x"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this! **Only the first box and the two ticks at the end are required**, and a sentence or two is plenty.
        If you're not sure about something, leave it out. We'll ask if we need more.

  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
      description: What happened, and what you expected to happen instead. Rough notes are fine.
      placeholder: |
        e.g. I ran the AIRAC Service for ZLC with Airways included. It finished, but V21 is missing
        from the airway file. I expected V21 to be there like it was last cycle.

        If you saw an error message, paste its exact text here.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (optional)
      description: If you remember what you clicked, list it here so we can make it happen too.
      placeholder: |
        1. Open AIRAC Service > Airways
        2. Turn on ...
        3. Click Run AIRAC Service
        4. ...

  - type: textarea
    id: attachments
    attributes:
      label: Log, screenshots, and files (optional)
      description: |
        Drag files into this box, or paste a screenshot with Ctrl+V.
        - **Log:** today's log is `%APPDATA%\FE-Buddy\Logs\FE-Buddy_<date>.log`.
        - **Crash:** also attach `febuddy-wpf-crash.txt` from the same folder if it exists.
      placeholder: Drop files or screenshots here.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the open issues and this hasn't been reported yet.
          required: true
        - label: Nothing I've attached contains a GitHub token, password, or other private information.
          required: true
