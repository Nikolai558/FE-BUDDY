name: Feature request
description: Suggest a new feature, or an improvement to an existing one.
title: "[FEAT REQ.] - "
labels: ["feature", "v3.x"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! **A sentence or two is enough to get started.** We'll follow up with questions if we need more.

  - type: textarea
    id: request
    attributes:
      label: What would you like FE-BUDDY to do?
      description: Plain words are perfect. If you can, say what it would fix or save you today.
      placeholder: |
        e.g. Let me pick which airways the AIRAC Service leaves out of the airway files.
        Right now I delete the same ones by hand every cycle for ZLC.
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Examples or attachments (optional)
      description: Screenshots, sketches, example files, links, or FAA or vNAS references.
      placeholder: Drop files or screenshots here, or paste links.
