name: Documentation problem
description: Something in the docs or the app's text is wrong, unclear, or missing.
title: "[DOCS] - "
labels: ["docs", "v3.x"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing, and where?
      description: A link to the page, or where you saw it in the app, helps us find it.
      placeholder: |
        e.g. User Guide > Airways says the output goes to the Airways folder, but it actually goes to ...
        or: The tooltip on the Settings page's update channel doesn't explain what Beta means.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
      description: What it should say instead, if you know.
      placeholder: e.g. Change it to "Output is saved to ..."
