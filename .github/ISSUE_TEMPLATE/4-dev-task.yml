name: Development task
description: For maintainers. Planned code work - UI, logic, build, or tests.
title: "[TASK] - "
labels: ["task", "v3.x"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind of work
      multiple: true
      options:
        - UI (views, cards, styles)
        - Logic (FeBuddy.Core)
        - Installer or updater
        - Build, CI, or release
        - Tests
        - Cleanup or refactor
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What needs to be done, and why?
      placeholder: |
        What should be added, reworked, or removed, and why.

        Steps:
        1.
        2.

        Tests needed: (for logic changes, to keep FeBuddy.Core's coverage up)

        References: (related issues, files, docs, or FAA and vNAS references)
    validations:
      required: true
