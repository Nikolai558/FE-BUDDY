# CI for FE-BUDDY 3.0.
#
# Verifies that it compiles and the unit tests pass on every push and pull
# request to v3-development (and every pull request into releases), that the
# code coverage of FeBuddy.Core and FeBuddy.Versioning has not dropped (the
# table is on each run's summary page; the full HTML report is the
# "coverage-report" artifact), and that the MSI still builds (the "installer"
# artifact - for testing, not a release). Build and Test are required checks on
# both branches' rulesets. Releases are made by release-checks.yml and
# release.yml - see docs/Developers/RELEASING.md.
#
# A pull request into v3-development that changes only Markdown (.md) files
# outside the FeBuddy/ source folder - documentation, ChangeLog.md - skips
# Build, Test and Installer. A skipped job counts as passed for a required
# check, so the pull request can still merge. Markdown inside FeBuddy/, and the
# root News.md, still run everything: News.md is built into the app and the
# tests read it.
# CodeQL (codeql-analysis.yml) still runs on every pull request, because the
# rulesets' code scanning rule blocks a merge until CodeQL has results for it.

name: "CI"

on:
  workflow_dispatch:

  push:
    branches: [ v3-development ]

  pull_request:
    branches: [ v3-development, releases ]

# Build, test and package only - nothing here writes to the repository.
permissions:
  contents: read

jobs:
  # Decides whether the jobs below run. Anything other than a pull request into
  # v3-development always runs them.
  changes:
    name: Changes
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      code: ${{ steps.files.outputs.code }}

    steps:
      - name: Check for changes besides documentation
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ "$GITHUB_BASE_REF" != "v3-development" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A renamed file is listed under both names, so moving code to a .md name still counts.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')

          # Anything unexpected - an empty list included - leaves code=true.
          code=false
          while IFS= read -r file; do
            if [[ ! "$file" =~ \.[mM][dD]$ ]] || [[ "$file" == FeBuddy/* ]] || [[ "$file" == News.md ]]; then
              echo "Needs Build and Test: '$file'"
              code=true
              break
            fi
          done <<< "$files"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "false" ]; then
            echo "Only documentation (.md) changed, so Build, Test and Installer are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build
    runs-on: windows-2025
    needs: changes
    # Skipped only when Changes succeeded and found nothing but documentation. If
    # Changes itself fails, this still runs, so a broken check never skips the build.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Build solution
        run: dotnet build FeBuddy/FeBuddy.sln -c Release

  test:
    name: Test
    runs-on: windows-2025
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # Runs the tests with coverage, writes the coverage table to this run's summary page,
      # and fails if FeBuddy.Core coverage drops below the floor (line / branch percent).
      - name: Test library with coverage
        shell: pwsh
        run: ./FeBuddy/coverage.ps1 -Configuration Release -MinimumLineCoverage 95 -MinimumBranchCoverage 90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: FeBuddy/TestResults/CoverageReport
          if-no-files-found: ignore

  installer:
    name: Installer
    runs-on: windows-2025
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # Publishes the app and builds the MSI exactly as a release would. The installer
      # counter it advances stays in this runner's checkout (see
      # docs/Developers/MSI-VERSION-NUMBERING.md).
      - name: Build MSI
        shell: pwsh
        run: ./FeBuddy/build.ps1

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: FeBuddy/releases/*.msi
          retention-days: 1
