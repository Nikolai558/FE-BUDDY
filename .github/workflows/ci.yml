# CI for FE-BUDDY 3.0.
#
# Verifies that it compiles and the unit tests pass on every push and pull
# request to v3-development. It does NOT produce a release (no installer or
# release workflow yet; v2 on the development branch is the model to follow
# when v3 gets one).

name: "CI"

on:
  workflow_dispatch:

  push:
    branches: [ v3-development ]

  pull_request:
    branches: [ v3-development ]

jobs:
  build:
    name: Build
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Build solution
        run: dotnet build FeBuddy/FeBuddy.sln -c Release

  test:
    name: Test
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Test library
        run: dotnet test FeBuddy/FeBuddy.UnitTests/FeBuddy.UnitTests.csproj -c Release --logger "console;verbosity=normal"
