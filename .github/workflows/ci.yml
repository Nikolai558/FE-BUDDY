# CI for FE-BUDDY 3.0.
#
# Verifies that it compiles and the unit tests pass on every push and pull
# request to v3-development, that the code coverage of FeBuddy.Core and
# FeBuddy.Versioning has not dropped (the table is on each run's summary page;
# the full HTML report is the "coverage-report" artifact), and that the MSI
# still builds (the "installer" artifact - for testing, not a release). It does
# NOT publish a release: there is no release workflow yet.

name: "CI"

on:
  workflow_dispatch:

  push:
    branches: [ v3-development ]

  pull_request:
    branches: [ v3-development ]

jobs:
  build:
    name: Build
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Build solution
        run: dotnet build FeBuddy/FeBuddy.sln -c Release

  test:
    name: Test
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # Runs the tests with coverage, writes the coverage table to this run's summary page,
      # and fails if FeBuddy.Core coverage drops below the floor (line / branch percent).
      - name: Test library with coverage
        shell: pwsh
        run: ./FeBuddy/coverage.ps1 -Configuration Release -MinimumLineCoverage 95 -MinimumBranchCoverage 90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: FeBuddy/TestResults/CoverageReport
          if-no-files-found: ignore

  installer:
    name: Installer
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # Publishes the app and builds the MSI exactly as a release would. The installer
      # counter it advances stays in this runner's checkout (see
      # docs/Developers/MSI-VERSION-NUMBERING.md).
      - name: Build MSI
        shell: pwsh
        run: ./FeBuddy/build.ps1

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: FeBuddy/releases/*.msi
          retention-days: 1
