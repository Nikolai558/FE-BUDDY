# CodeQL security analysis for FE-BUDDY 3.0.
#
# Scans C# code on pushes and pull requests to v3-development, as well as on a
# weekly schedule. Results upload to GitHub code scanning (free for this public
# repo), which the dev-branch ruleset requires before a pull request can merge.

name: "CodeQL"

on:
  workflow_dispatch:

  push:
    branches: [ v3-development ]

  pull_request:
    branches: [ v3-development ]

  schedule:
    - cron: '0 8 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: windows-2025

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
